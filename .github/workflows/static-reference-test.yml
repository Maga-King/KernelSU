name: Static SELinux reference compile check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi: [android15-6.6, android16-6.12]
        reference: ['n', 'y']
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Reference generator regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Compile the optional reference
        env:
          REFERENCE_ENABLED: ${{ matrix.reference }}
          TEST_KMI: ${{ matrix.kmi }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd kernel
          CONFIG_KSU=m CONFIG_KSU_STATIC_SELINUX_REFERENCE="$REFERENCE_ENABLED" CC=clang make 2>&1 | tee "$GITHUB_WORKSPACE/compile.log"
          mkdir -p "$GITHUB_WORKSPACE/test-artifact"
          cp kernelsu.ko "$GITHUB_WORKSPACE/test-artifact/compile-test-only-$TEST_KMI-ref-$REFERENCE_ENABLED.ko"
          sha256sum feature/reference.policy > "$GITHUB_WORKSPACE/test-artifact/reference.sha256"
      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-test-only-${{ matrix.kmi }}-reference-${{ matrix.reference }}
          path: |
            compile.log
            test-artifact/
